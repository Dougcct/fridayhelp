<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0f17" />
  <title>Friday Help</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%23f59e0b'/%3E%3Cstop offset='100%25' stop-color='%23ea580c'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M35 12L19 35h11l-2 17 17-23H34l1-17z' fill='%230b0f17'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <div class="brand">
        <span class="brand-badge" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13 2 4 14h7l-1 8 10-13h-7l0-7z" fill="currentColor" stroke="none"/>
          </svg>
        </span>
        <div>
          <h1>Friday Help</h1>
          <p class="subtitle">Monitor de ofertas, metas e histórico de preços</p>
        </div>
      </div>

      <div class="topbar-actions">
        <span id="syncStatus" class="sync-pill sync-offline" title="Status de persistência">Carregando...</span>
        <button id="btnExport" class="btn btn-secondary" type="button" title="Exportar JSON">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
          <span>Exportar</span>
        </button>
        <label class="btn btn-secondary file-label" title="Importar JSON">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
          <span>Importar</span>
          <input id="inputImport" type="file" accept="application/json" hidden />
        </label>
        <button id="btnNewItem" class="btn btn-primary" type="button">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg>
          <span>Novo Item</span>
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- Resumo / KPIs -->
    <section class="kpi-grid" aria-label="Resumo financeiro">
      <article class="kpi-card">
        <div class="kpi-head">
          <span class="kpi-icon kpi-icon-info" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
          </span>
          <span class="kpi-label">Orçamento Alvo (Ativos)</span>
        </div>
        <strong id="kpiTargetTotal" class="kpi-value">R$ 0,00</strong>
        <span id="kpiItemCount" class="kpi-sub">0 itens monitorados</span>
      </article>
      <article class="kpi-card">
        <div class="kpi-head">
          <span class="kpi-icon kpi-icon-primary" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41 13.42 20.58a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82Z"/><line x1="7" x2="7.01" y1="7" y2="7"/></svg>
          </span>
          <span class="kpi-label">Melhor Soma Atual</span>
        </div>
        <strong id="kpiBestTotal" class="kpi-value">R$ 0,00</strong>
        <span id="kpiOffersCount" class="kpi-sub">0 ofertas registradas</span>
      </article>
      <article class="kpi-card">
        <div class="kpi-head">
          <span class="kpi-icon kpi-icon-success" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/></svg>
          </span>
          <span class="kpi-label">Economia vs. Preço Cheio</span>
        </div>
        <strong id="kpiSavings" class="kpi-value text-success">R$ 0,00</strong>
        <span class="kpi-sub">Baseado nas melhores ofertas</span>
      </article>
      <article class="kpi-card">
        <div class="kpi-head">
          <span class="kpi-icon kpi-icon-accent" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          </span>
          <span class="kpi-label">Metas &amp; Compras</span>
        </div>
        <strong id="kpiGoals" class="kpi-value text-accent">0 / 0</strong>
        <span id="kpiPurchased" class="kpi-sub">0 comprados</span>
      </article>
    </section>

    <!-- Navegação por abas -->
    <nav class="tabs" aria-label="Seções">
      <button class="tab-btn active" data-tab="items" type="button">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
        Produtos &amp; Ofertas
      </button>
      <button class="tab-btn" data-tab="history" type="button">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
        Histórico de Atividades
      </button>
    </nav>

    <!-- Aba: Produtos -->
    <section id="tab-items" class="tab-panel active">
      <div class="filters-bar">
        <input id="filterSearch" type="search" placeholder="Buscar produto, loja ou observação..." />
        <select id="filterCategory">
          <option value="all">Todas as categorias</option>
        </select>
        <select id="filterStatus">
          <option value="all">Todos os status</option>
          <option value="Monitorando">Monitorando</option>
          <option value="Meta atingida">Meta atingida</option>
          <option value="Comprado">Comprado</option>
          <option value="Descartado">Descartado</option>
        </select>
        <select id="filterPriority">
          <option value="all">Todas prioridades</option>
          <option value="Alta">Alta</option>
          <option value="Média">Média</option>
          <option value="Baixa">Baixa</option>
        </select>
        <select id="sortBy">
          <option value="priority">Ordenar: Prioridade</option>
          <option value="bestPriceAsc">Menor melhor preço</option>
          <option value="discountDesc">Maior desconto %</option>
          <option value="nameAsc">Nome (A-Z)</option>
        </select>
      </div>

      <div id="categoryPills" class="category-pills" aria-label="Filtro rápido por categoria"></div>

      <div id="itemsList" class="items-list"></div>
    </section>

    <!-- Aba: Histórico -->
    <section id="tab-history" class="tab-panel">
      <div class="history-header">
        <h2>Linha do Tempo</h2>
        <button id="btnClearHistory" class="btn btn-secondary btn-sm" type="button">Limpar histórico</button>
      </div>
      <div id="historyList" class="history-list"></div>
    </section>
  </main>

  <!-- Modal: Novo / Editar Item -->
  <dialog id="itemModal" class="modal">
    <form id="itemForm" method="dialog" class="modal-content">
      <div class="modal-header">
        <h2 id="itemModalTitle">Novo Item</h2>
        <button type="button" class="icon-btn" data-close-modal="itemModal" aria-label="Fechar">&times;</button>
      </div>
      <input type="hidden" id="itemId" />
      <div class="form-grid">
        <label class="full">
          Nome do Produto *
          <input id="itemName" type="text" required placeholder="Ex: SSD NVMe 1TB Kingston" />
        </label>
        <label>
          Categoria
          <input id="itemCategory" type="text" list="categorySuggestions" placeholder="Ex: Hardware, Áudio &amp; Som" />
          <datalist id="categorySuggestions">
            <option value="Hardware"></option>
            <option value="Periféricos"></option>
            <option value="Notebooks &amp; PCs"></option>
            <option value="Celulares &amp; Tablets"></option>
            <option value="TV &amp; Vídeo"></option>
            <option value="Áudio &amp; Som"></option>
            <option value="Som Automotivo"></option>
            <option value="Games"></option>
            <option value="Eletrônicos"></option>
            <option value="Casa &amp; Eletrodomésticos"></option>
            <option value="Ferramentas"></option>
            <option value="Automotivo"></option>
            <option value="Moda &amp; Beleza"></option>
            <option value="Esporte &amp; Lazer"></option>
            <option value="Outros"></option>
          </datalist>
        </label>
        <label>
          Prioridade
          <select id="itemPriority">
            <option value="Alta">Alta</option>
            <option value="Média" selected>Média</option>
            <option value="Baixa">Baixa</option>
          </select>
        </label>
        <label>
          Preço-Alvo (R$) *
          <input id="itemTargetPrice" type="number" step="0.01" min="0" required placeholder="0.00" />
        </label>
        <label>
          Status
          <select id="itemStatus">
            <option value="Monitorando">Monitorando</option>
            <option value="Meta atingida">Meta atingida</option>
            <option value="Comprado">Comprado</option>
            <option value="Descartado">Descartado</option>
          </select>
        </label>
        <label class="full">
          Observações / Especificações mínimas
          <textarea id="itemNotes" rows="3" placeholder="Ex: Mínimo 16GB RAM, preferência por loja oficial..."></textarea>
        </label>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-close-modal="itemModal">Cancelar</button>
        <button type="submit" class="btn btn-primary">Salvar Item</button>
      </div>
    </form>
  </dialog>

  <script src="js/app.js"></script>
</body>
</html>
